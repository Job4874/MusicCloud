# Prepared locally. Connect a provider or upload this file only after user approval.
# Manual only: no triggering events, scheduled builds, signing, or publishing.
workflows:
  musiccloud-iphone-unsigned:
    name: MusicCloud unsigned iPhone (manual)
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Check original model behavior
        script: bash iphone/check-models.sh
      - name: Check lossless legacy export adapter
        script: bash iphone/Migration/run-checks.sh
      - name: Check production library migration
        script: bash iphone/Migration/ProductionTests/run-checks.sh
      - name: Check saved artwork
        script: bash iphone/ArtworkTests/run-checks.sh
      - name: Check Wi-Fi upload boundaries
        script: bash iphone/WiFiUploadTests/run-checks.sh
      - name: Check playback queue recovery
        script: bash iphone/check-queue.sh
      - name: Compile native app and package unsigned IPA
        script: |
          set -euo pipefail
          bash iphone/build-unsigned.sh
          test -s iphone/build/MusicCloud-unsigned.ipa
    artifacts:
      - iphone/build/MusicCloud-unsigned.ipa
